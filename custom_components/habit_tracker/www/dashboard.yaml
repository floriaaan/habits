# Replace sensor.habit_tracker_dashboard if HA assigned a different entity_id.
title: Habitudes
views:
  - title: Mes habitudes
    path: habit-tracker
    icon: mdi:check-circle-outline
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: custom:habit-tracker-card
            entity: sensor.habit_tracker_dashboard
            mode: rings
            grid_options: {columns: full, rows: auto}
          - type: custom:habit-tracker-card
            entity: sensor.habit_tracker_dashboard
            mode: weekly
          - type: custom:habit-tracker-card
            entity: sensor.habit_tracker_dashboard
            mode: heatmap
      - type: grid
        cards:
          - type: custom:habit-tracker-card
            entity: sensor.habit_tracker_dashboard
            mode: habits
            category: mind
          - type: custom:habit-tracker-card
            entity: sensor.habit_tracker_dashboard
            mode: habits
            category: daily
      - type: grid
        cards:
          - type: custom:habit-tracker-card
            entity: sensor.habit_tracker_dashboard
            mode: nutrition
          - type: custom:habit-tracker-card
            entity: sensor.habit_tracker_dashboard
            mode: sport
