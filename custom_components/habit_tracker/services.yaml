perform_action:
  name: Habit action
  description: Complete, undo, add or remove one configured step using an authenticated dashboard entity.
  target:
    entity:
      integration: habit_tracker
      domain: sensor
  fields:
    habit_id:
      required: true
      selector:
        text:
    action:
      required: true
      selector:
        select:
          options:
            - complete
            - uncomplete
            - increment
            - decrement
