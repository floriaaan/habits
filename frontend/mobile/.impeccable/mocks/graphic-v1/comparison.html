<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;color:var(--foreground,#171b18);font-family:var(--font-sans,system-ui)}.intro{font-size:14px;line-height:1.5;margin:0 0 12px}.tools{display:flex;gap:6px;margin-bottom:18px}button{font:inherit;font-size:14px;color:inherit;background:var(--secondary,#eee);border:1px solid var(--border,#bbb);min-height:44px;padding:9px 18px;border-radius:10px;cursor:pointer}button[aria-pressed=true]{border:2px solid var(--foreground,#171b18);font-weight:600}button:focus-visible{outline:3px solid var(--ring,#ed7437);outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}h2{font-size:16px;line-height:1.4;margin:0 0 12px;font-weight:650}figure{margin:0}.grid img{display:block;width:100%;height:auto;border-radius:24px}body:not(.old) .before{display:none}body.old .after{display:none}.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted-foreground,#666);margin-top:16px}.legend span{display:flex;align-items:center;gap:6px}.swatch{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid #888}.note{color:var(--muted-foreground,#666);font-size:12px;line-height:1.5;margin-top:12px}@media(max-width:560px){.grid{grid-template-columns:1fr;gap:24px}figure{max-width:380px;margin:auto}}</style><p class="intro">Une touche plus brute, avec la composition validée : aplats plus mats, contours nets et accents orange/vert.</p><div class="tools" role="group" aria-label="Comparer le style"><button aria-pressed="false" id="old" onclick="setView(true)">Avant</button><button aria-pressed="true" id="new" onclick="setView(false)">Proposition</button></div><main class="grid"><figure><h2>Accueil V4</h2><img class="before" src="/Users/floriaaan/.t3/worktrees/habits/t3-f751c5cc/frontend/mobile/.impeccable/mocks/decision/dashboard-v4.png" alt="Accueil V4, maquette précédente"><img class="after" src="/Users/floriaaan/.t3/worktrees/habits/t3-f751c5cc/frontend/mobile/.impeccable/mocks/graphic-v1/home.png" alt="Accueil V4, évolution graphique avec aplats ivoire et contrôles détourés"></figure><figure><h2>Aujourd’hui · piste « liste par état »</h2><img class="before" src="/Users/floriaaan/.t3/worktrees/habits/t3-f751c5cc/frontend/mobile/.impeccable/mocks/today/sections.png" alt="Aujourd’hui · piste « liste par état », maquette précédente"><img class="after" src="/Users/floriaaan/.t3/worktrees/habits/t3-f751c5cc/frontend/mobile/.impeccable/mocks/graphic-v1/today-v2.png" alt="Aujourd’hui · piste « liste par état », évolution graphique avec aplats ivoire et contrôles détourés"></figure></main><div class="legend"><span><i class="swatch" style="background:#f2f0e7"></i>Ivoire chaud</span><span><i class="swatch" style="background:#151b13"></i>Contours nets</span><span><i class="swatch" style="background:#e77636"></i>Orange ponctuel</span><span><i class="swatch" style="background:#64df24"></i>Validation franche</span></div><p class="note">Maquettes de style, données fictives. La piste Aujourd’hui illustre le système sans arrêter le choix de cette page.</p><script>function setView(old){document.body.classList.toggle('old',old);document.getElementById('old').setAttribute('aria-pressed',String(old));document.getElementById('new').setAttribute('aria-pressed',String(!old))}window.addEventListener('load',()=>console.log(JSON.stringify({loaded:[...document.images].every(i=>i.complete&&i.naturalWidth>0),overflow:document.documentElement.scrollWidth>innerWidth})));</script></html>
