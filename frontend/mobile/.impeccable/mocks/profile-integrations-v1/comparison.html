function dedicated(){return `<section class="card head"><button class="back" onclick="variant='Bprofile';render()">‹ Profil</button><h1 style="margin:12px 0">Intégrations</h1><p class="intro">Reliez vos services à vos habitudes.</p></section><section class="card service-block">${service('strava')}<p>Associez vos activités sportives à vos habitudes.</p><button class="action" onclick="openService('strava')">Gérer Strava</button></section><section class="card service-block">${service('ha')}<p>Reliez vos habitudes à votre maison connectée.</p><button class="action" onclick="openService('ha')">${connected?'Gérer Home Assistant':'Connecter Home Assistant'}</button></section>`}
function panel(){return `<div class="scrim" onclick="variant='Cprofile';render()"></div><section class="sheet" role="dialog" aria-label="Intégrations"><div class="handle"></div><button class="close" aria-label="Fermer le panneau" onclick="variant='Cprofile';render()">×</button><h2>Intégrations</h2><p class="intro">Vos services, au même endroit.</p>${service('strava')}${service('ha')}<footer>Choisissez un service pour le connecter<br>ou gérer ses réglages.</footer></section>`}
function details(){const s=detail,ha=s==='ha';return `<div class="scrim" onclick="closeService()"></div><section class="sheet detail-view" role="dialog" aria-label="Réglages ${ha?'Home Assistant':'Strava'}"><div class="handle"></div><button class="close" aria-label="Fermer les réglages" onclick="closeService()">×</button><div class="detail-title"><img class="${s}" src="${logos[s]}" alt=""><h2>${ha?'Home Assistant':'Strava'}</h2></div><p class="intro">${ha?'Reliez vos habitudes à votre maison connectée.':'Associez vos activités à vos habitudes et lancez leur synchronisation.'}</p>${ha&&!connected?`<div class="warning">Renseignez l’adresse de votre instance et un jeton d’accès à l’étape suivante.</div><button class="action" onclick="connected=true;message='Connexion simulée';render()">Configurer Home Assistant</button>`:`<span class="state ok"><i class="dot"></i>Connecté</span>${!ha?row('link','Habitudes associées','',"message='Exemple : Course à pied → Courir';render()")+row('calendar','Synchroniser les activités','',"message='Synchronisation simulée terminée';render()"):row('tune','Réglages de connexion','',"message='Les réglages seront disponibles dans l’application';render()")}`}<p class="feedback" role="status">${message}</p><p class="caption" style="margin-top:22px">Aperçu uniquement · aucune donnée envoyée.</p></section>`}
function render(){const base=variant[0];document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===base)));document.getElementById('concept').textContent=copy[base][0];document.getElementById('summary').textContent=copy[base][1];document.getElementById('reason').textContent=copy[base][2];document.getElementById('badge').style.display=base==='A'?'inline-block':'none';const p=document.getElementById('phone');p.classList.toggle('dark',dark);p.innerHTML=status+`<div class="content">${variant==='B'?dedicated():profile()}</div>`+dock+(variant==='C'?panel():'')+(detail?details():'');}
function openService(s){detail=s;message='';render()}function closeService(){detail=null;message='';render()}function showIntegrations(){variant=variant[0];render()}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{variant=b.dataset.v;detail=null;message='';render()});document.getElementById('theme').onclick=function(){dark=!dark;this.textContent=dark?'Voir en clair':'Voir en sombre';this.setAttribute('aria-pressed',String(dark));render()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&detail)closeService()});render();window.addEventListener('load',()=>console.log('QA',JSON.stringify({images:[...document.images].every(i=>i.complete&&i.naturalWidth>0),pageOverflow:document.documentElement.scrollWidth>innerWidth,variantCount:document.querySelectorAll('[data-v]').length})));
</script></body></html>
