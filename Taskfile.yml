version: '3'

vars:
  DEV_UID:
    sh: id -u
  DEV_GID:
    sh: id -g
  COMPOSE: docker compose --project-name habits-dev --file compose.dev.yaml
  TIMEZONE: Europe/Paris
  HA_CLIENT: integrations/home-assistant/habit-tracker-ha
  HA_REPOSITORY: floriaaan/habit-tracker-ha

env:
  DEV_UID: '{{.DEV_UID}}'
  DEV_GID: '{{.DEV_GID}}'

tasks:
  default:
    cmds:
      - task --list

  dev:
    desc: Compile et lance l'API depuis les sources dans Docker (Ctrl+C pour arrêter)
    deps: [dev:prepare]
    cmds:
      - defer: '{{.COMPOSE}} down'
      - '{{.COMPOSE}} up --no-build --abort-on-container-exit --exit-code-from dev'

  dev:bootstrap:
    desc: Crée le premier PAT local sur la base de développement (une seule fois)
    deps: [dev:prepare]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps dev cargo run --locked -- bootstrap-local {{.TIMEZONE | shellQuote}}'

  dev:test:
    desc: Exécute les tests dans le conteneur Rust
    deps: [dev:prepare]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps dev cargo test --locked --all-targets'

  dev:cargo:
    desc: Lance Cargo dans Docker (task dev:cargo -- check --locked)
    deps: [dev:prepare]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps dev cargo {{.CLI_ARGS}}'

  dev:shell:
    desc: Ouvre un shell dans le conteneur de développement
    interactive: true
    deps: [dev:prepare]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps dev bash --noprofile --norc'

  mobile:
    desc: Lance Expo (mode fake par défaut)
    cmds: [pnpm mobile]

  mobile:ios:
    desc: Compile et lance le development build iOS
    cmds: [pnpm mobile:ios]

  mobile:android:
    desc: Compile et lance le development build Android
    cmds: [pnpm mobile:android]

  mobile:check:
    desc: Vérifie les types et les tests mobiles
    cmds: [pnpm typecheck, pnpm test:mobile]

  ha:sync:
    desc: Synchronise les cartes vers un dossier HA monté (HA_WWW_DIR, www du composant pour HACS)
    requires:
      vars: [HA_WWW_DIR]
    env:
      HA_SYNC_DEST: '{{.HA_WWW_DIR}}'
    sources:
      - integrations/home-assistant/cards/habit-lab-visual-card.js
      - '{{.HA_CLIENT}}/custom_components/habit_tracker/www/habit-tracker-card.js'
    # Copier aussi au premier lancement ou si la destination change.
    status: ['false']
    preconditions:
      - sh: test -d "$HA_SYNC_DEST"
        msg: HA_WWW_DIR doit être un dossier existant (www du composant connecté ou du prototype).
    cmds:
      - cp integrations/home-assistant/cards/habit-lab-visual-card.js "$HA_SYNC_DEST/habit-lab-visual-card.js"
      - cp {{.HA_CLIENT}}/custom_components/habit_tracker/www/habit-tracker-card.js "$HA_SYNC_DEST/habit-tracker-card.js"

  ha:package:
    desc: Exporte les archives du client HACS verrouillé par le sous-module
    env:
      HA_EXPORT_REPOSITORY: '{{.HA_REPOSITORY}}'
    cmds:
      - python3 scripts/package_home_assistant.py --repository "$HA_EXPORT_REPOSITORY"

  ha:install:
    desc: Copie l'intégration avec sa carte et le prototype dans une configuration HA montée
    requires:
      vars: [HA_CONFIG_DIR]
    env:
      HA_INSTALL_DEST: '{{.HA_CONFIG_DIR}}'
    cmds:
      - python3 scripts/install_home_assistant.py "$HA_INSTALL_DEST"

  ha:sync:ssh:
    desc: Synchronise les deux cartes par SSH (task --watch ha:sync:ssh HA_SSH_HOST=alias-ssh)
    requires:
      vars: [HA_SSH_HOST]
    env:
      HA_SSH_TARGET: '{{.HA_SSH_HOST}}'
    sources:
      - integrations/home-assistant/cards/habit-lab-visual-card.js
      - '{{.HA_CLIENT}}/custom_components/habit_tracker/www/habit-tracker-card.js'
    status: ['false']
    cmds:
      - |
        tar -cf - -C integrations/home-assistant/cards habit-lab-visual-card.js -C ../habit-tracker-ha/custom_components/habit_tracker/www habit-tracker-card.js |
        ssh -- "$HA_SSH_TARGET" '
          set -eu
          if test -f /homeassistant/configuration.yaml; then
            ha_config_dir=/homeassistant
          elif test -f /config/configuration.yaml; then
            ha_config_dir=/config
          else
            echo "HA configuration directory not found" >&2
            exit 1
          fi
          ha_card_dir="$ha_config_dir/www/habit-tracker"
          mkdir -p "$ha_card_dir"
          ha_card_tmp=$(mktemp -d "$ha_card_dir/.cards.XXXXXX")
          trap '\''rm -f "$ha_card_tmp/habit-lab-visual-card.js" "$ha_card_tmp/habit-tracker-card.js"; rmdir "$ha_card_tmp"'\'' EXIT
          tar -xf - -C "$ha_card_tmp"
          for ha_card_name in habit-lab-visual-card.js habit-tracker-card.js; do
            chmod 644 "$ha_card_tmp/$ha_card_name"
            ha_card_destination="$ha_card_dir"
            if test "$ha_card_name" = habit-tracker-card.js && test -d "$ha_config_dir/custom_components/habit_tracker/www"; then
              ha_card_destination="$ha_config_dir/custom_components/habit_tracker/www"
            fi
            mv -f "$ha_card_tmp/$ha_card_name" "$ha_card_destination/$ha_card_name"
          done
        '

  dev:prepare:
    internal: true
    cmds:
      - mkdir -p target/docker data/dev
      - chmod 700 data/dev
