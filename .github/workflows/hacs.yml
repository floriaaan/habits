name: Home Assistant package
on:
  push:
    paths:
      - '.gitmodules'
      - 'integrations/home-assistant/habit-tracker-ha'
      - 'scripts/package_home_assistant.py'
      - 'tests/test_hacs_package.py'
      - '.github/workflows/hacs.yml'
  pull_request:
    paths:
      - '.gitmodules'
      - 'integrations/home-assistant/habit-tracker-ha'
      - 'scripts/package_home_assistant.py'
      - 'tests/test_hacs_package.py'
      - '.github/workflows/hacs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hacs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - run: python3 -m unittest discover -s tests -p test_hacs_package.py -v
      - name: Export integration and curated repository (no publication)
        env:
          HA_REPOSITORY: floriaaan/habit-tracker-ha
        run: python3 scripts/package_home_assistant.py --repository "$HA_REPOSITORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: habit-tracker-hacs
          path: target/hacs/*.zip
          if-no-files-found: error
