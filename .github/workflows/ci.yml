name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - run: cargo run --locked -- openapi > /tmp/openapi.json && diff -u docs/openapi.json /tmp/openapi.json
      - run: python3 scripts/check_domain_boundaries.py
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --locked check
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/docker_smoke.py
