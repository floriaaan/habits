name: ci
on:
  push:
    paths-ignore:
      - 'docs/**/*.md'
      - 'README.md'
      - 'README.fr.md'
      - 'TODO-MVP.md'
  pull_request:
    paths-ignore:
      - 'docs/**/*.md'
      - 'README.md'
      - 'README.fr.md'
      - 'TODO-MVP.md'
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  publication:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
      image: ${{ steps.policy.outputs.image }}
      release: ${{ steps.policy.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: policy
        run: python3 scripts/ci_publication.py

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          cache-bin: 'false'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      # The release build runs once per architecture in Docker, not again here.
      - run: cargo run --locked -- openapi > /tmp/openapi.json && diff -u docs/openapi.json /tmp/openapi.json
      - run: python3 scripts/check_domain_boundaries.py
      - run: python3 -m unittest discover -s tests -p test_ci_publication.py -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-debug-amd64
          path: target/debug/habit-tracker
          retention-days: 1
          if-no-files-found: error

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tools
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: security-${{ runner.os }}-${{ runner.arch }}-rust-1.99.1-audit-0.22.2-deny-0.20.2
      - name: Install pinned audit tools on cache miss
        if: steps.tools.outputs.cache-hit != 'true'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/security-target
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      # Only binaries are cached: advisory checks execute and refresh on every run.
      - run: cargo audit --deny warnings
      - run: cargo deny --locked check

  home-assistant:
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-debug-amd64
          path: target/debug
      - run: chmod +x target/debug/habit-tracker
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/requirements-home-assistant.txt
      - run: python -m pip install -r .github/requirements-home-assistant.txt
      - run: python -m unittest discover -s tests -p test_home_assistant.py -v
        env:
          HABIT_TRACKER_BIN: ${{ github.workspace }}/target/debug/habit-tracker

  container:
    needs: publication
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build native release image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: |
            habit-tracker:0.1.0
            habit-tracker:ci-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,scope=container-${{ matrix.arch }},mode=max
      - name: Smoke-test this exact image, without rebuilding
        run: python3 scripts/docker_smoke.py --no-build
      - name: Export tested image for publication
        if: needs.publication.outputs.publish == 'true'
        env:
          IMAGE_ARCH: ${{ matrix.arch }}
        run: docker image save "habit-tracker:ci-$IMAGE_ARCH" | gzip -1 > "$RUNNER_TEMP/image-$IMAGE_ARCH.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.publication.outputs.publish == 'true'
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  build-and-push:
    needs: [publication, rust, security, container, home-assistant]
    # Keep the trusted event guard outside repository-controlled Python outputs:
    # a PR editing the policy script must never reach a write-enabled job.
    if: >-
      needs.publication.outputs.publish == 'true' &&
      github.event.repository.fork == false &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
         startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define final tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.publication.outputs.image }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}},enable=${{ needs.publication.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Push tested images and assemble the manifest (no compilation)
        env:
          IMAGE: ${{ needs.publication.outputs.image }}
          DOCKER_METADATA: ${{ steps.metadata.outputs.json }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import subprocess

          def docker(*args):
              return subprocess.check_output(["docker", *args], text=True)

          image = os.environ["IMAGE"]
          digests = []
          for arch in ("amd64", "arm64"):
              archive = Path(os.environ["RUNNER_TEMP"]) / f"images/image-{arch}.tar.gz"
              print(docker("load", "--input", str(archive)), flush=True)
              local = f"habit-tracker:ci-{arch}"
              info = json.loads(docker("image", "inspect", local))[0]
              assert info["Architecture"] == arch
              assert info["Config"]["Labels"]["org.opencontainers.image.revision"] == os.environ["GITHUB_SHA"]
              staging = f"{image}:build-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}-{arch}"
              docker("tag", local, staging)
              print(docker("push", staging), flush=True)
              info = json.loads(docker("image", "inspect", staging))[0]
              digest = [d for d in info["RepoDigests"] if d.startswith(image + "@sha256:")]
              assert len(digest) == 1
              digests.append(digest[0])
          tags = json.loads(os.environ["DOCKER_METADATA"])["tags"]
          assert tags
          arguments = [argument for tag in tags for argument in ("--tag", tag)]
          print(docker("buildx", "imagetools", "create", *arguments, *digests), flush=True)
          print(docker("buildx", "imagetools", "inspect", tags[0]), flush=True)
          PYTHON
