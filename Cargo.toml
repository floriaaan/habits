[package]
name = "habit-tracker"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Self-hosted, tenant-scoped habit tracking API"
license = "MIT"
publish = false

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower = { version = "=0.5.3", features = ["util", "limit"] }
tower-http = { version = "=0.7.1", features = ["trace"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
utoipa = { version = "=6.0.0", features = ["chrono", "uuid"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
chrono = { version = "=0.4.45", features = ["serde"] }
chrono-tz = "=0.10.4"
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
thiserror = "=2.0.21"

[dev-dependencies]
tempfile = "=3.27.0"
http-body-util = "=0.1.5"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
